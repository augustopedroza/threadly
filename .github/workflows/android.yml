# Builds a signed, installable Threadly APK.
#  - Every push to main (and manual runs): checks, then the APK as a run
#    artifact (Actions -> the run -> Artifacts).
#  - A version tag (git tag v1.2.0 && git push --tags): the same, plus a
#    GitHub Release with the APK attached.
# Signing uses the release key from repository secrets (see CLAUDE.md
# "Releases"), so these APKs install over each other and over local release
# builds. versionCode is the commit count (android/app/build.gradle.kts),
# hence the full-history checkout.
name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create Releases on tags
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.THREADLY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.THREADLY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.THREADLY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.THREADLY_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Release key secrets are missing; see CLAUDE.md 'Releases'."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APK
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            flutter build apk --release --build-name="${GITHUB_REF_NAME#v}"
          else
            flutter build apk --release
          fi
          NAME="threadly-${GITHUB_REF_NAME//\//-}-$(git rev-list --count HEAD).apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$NAME"
          echo "APK=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: threadly-apk
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APK" --title "Threadly $GITHUB_REF_NAME" --generate-notes
